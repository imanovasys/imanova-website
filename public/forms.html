<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Form detection</title></head>
<body>
<!--
  This page is never linked or visited by users. It exists purely so
  Netlify's build-time bot can detect the "contact" form and its fields,
  since the real form on /contact-us/ is rendered by a client component.
  See: https://docs.netlify.com/manage/forms/setup/#html-forms
-->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="email" name="email" />
  <input type="text" name="organization" />
  <input type="text" name="inquiry" />
  <textarea name="message"></textarea>
  <input type="text" name="bot-field" />
</form>
</body>
</html>
